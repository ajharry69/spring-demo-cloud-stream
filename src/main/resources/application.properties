spring.cloud.stream.bindings.businessCreatedListener-in-0.consumer.back-off-initial-interval=1000
# Prefetch 50 messages at once so the thread never waits for a network roundtrip
spring.cloud.stream.rabbit.bindings.businessCreatedListener-in-0.consumer.prefetch=50
# Automatically creates the DLQ
spring.cloud.stream.rabbit.bindings.businessCreatedListener-in-0.consumer.auto-bind-dlq=true
# Sends a failed message to DLQ instead of discarding
spring.cloud.stream.rabbit.bindings.businessCreatedListener-in-0.consumer.republish-to-dlq=true
# Message stays in DLQ for 5s before potentially being retried
